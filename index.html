  <body>
    <!-- Apply cached theme CSS vars before React mounts to prevent flash -->
    <script>
      try {
        var getCookie = function(name) {
          var encodedName = encodeURIComponent(name) + '=';
          var parts = document.cookie ? document.cookie.split('; ') : [];
          for (var i = 0; i < parts.length; i += 1) {
            if (parts[i].indexOf(encodedName) === 0) {
              return decodeURIComponent(parts[i].slice(encodedName.length));
            }
          }
          return null;
        };
        var css = localStorage.getItem('ballooncraftkc_new_design_theme_css') || getCookie('ballooncraftkc_new_design_theme_css');
        var radius = localStorage.getItem('ballooncraftkc_new_design_theme_radius') || getCookie('ballooncraftkc_new_design_theme_radius');
        if (css) {
          var vars = JSON.parse(css);
          var root = document.documentElement;
          Object.keys(vars).forEach(function(k) { root.style.setProperty(k, vars[k]); });
          if (radius) root.style.setProperty('--radius', radius);
        }
      } catch(e) {}
    </script>
    <div id="root"></div>
