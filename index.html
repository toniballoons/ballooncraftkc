<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BalloonCraft KC | Balloon Decorations Kansas City</title>
    <meta name="description" content="BalloonCraft KC creates stunning balloon structures and decorations for weddings, birthdays, corporate events, and celebrations across Kansas City, Overland Park, Olathe, and the KC metro area." />
    <meta name="keywords" content="balloon decorations Kansas City, balloon arch KC, balloon garland, event decorations, wedding balloons, birthday balloons, corporate event decorations, balloon sculptures Kansas City" />
    <meta property="og:title" content="BalloonCraft KC | Balloon Decorations Kansas City" />
    <meta property="og:description" content="Transform your events into unforgettable celebrations with stunning balloon structures and decorations across the Kansas City metro area." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Apply cached theme CSS vars before React mounts to prevent flash -->
    <script>
      try {
        var css = localStorage.getItem('ballooncraftkc_theme_css');
        var radius = localStorage.getItem('ballooncraftkc_theme_radius');
        if (css) {
          var vars = JSON.parse(css);
          var root = document.documentElement;
          Object.keys(vars).forEach(function(k) { root.style.setProperty(k, vars[k]); });
          if (radius) root.style.setProperty('--radius', radius);
        }
      } catch(e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
